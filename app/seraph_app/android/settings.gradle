pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def flutterSdkPath = properties.getProperty("flutter.sdk")
        assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
        return flutterSdkPath
    }()

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.13.0' apply false
    id "org.jetbrains.kotlin.android" version "2.3.20" apply false
}

include ":app"

// The seraph_local_media path plugin (its Android library lives under
// plugins/seraph_local_media/android). `flutter pub get` adds it to
// .flutter-plugins-dependencies; `flutter plugin loader` then includes the
// module here, so an explicit `include ":seraph_local_media"` is not needed
// and would duplicate the loader's own include. Kept as a comment so the
// presence of this plugin is visible at a glance.
