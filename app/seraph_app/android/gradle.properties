org.gradle.jvmargs=-Xmx4G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Four AGP 8 era flags were dropped here for AGP 9:
#   android.defaults.buildfeatures.buildconfig - removed in AGP 9 (it is now a
#     hard error). BuildConfig defaults to off; nothing in this project's own
#     sources referenced it. Re-enable per module via buildFeatures if needed.
#   android.nonTransitiveRClass / android.nonFinalResIds - the AGP 9 behaviour
#     is the only behaviour, so the opt-outs no longer exist.
#   android.enableJetifier - deprecated, defaults to false, and removed in AGP
#     10. Nothing here needed the support-library rewriting, and dropping it
#     removes that rewrite pass from every build.
# Built-in Kotlin is BLOCKED UPSTREAM - do not flip this to true until the
# plugins below stop applying the Kotlin Gradle Plugin. AGP 9 fails the build
# outright for any module that applies `kotlin-android` while this is true
# (verified: `:oidc_android` throws during configuration). All four are
# already at their latest published versions, so there is nothing to upgrade
# to:
#   audio_session 0.2.4, oidc_android 2.0.1 (3.0.0 exists but does not
#   migrate), package_info_plus 10.2.1, workmanager_android 0.10.9
# Re-test by setting this to true and running `flutter build apk --debug`.
# Removed in AGP 10, so this has a deadline.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
